{% with id=widget.attrs.id %}
<div class="permissions-checkboxes">
  {% for group_name, choices in widget.grouped_choices.items %}
    <div class="permission-group mb-3">
      <h6 class="border-bottom pb-2 mb-2">{{ group_name|safe }}</h6>
      <div class="row">
        {% for choice in choices %}
          <div class="col-md-6 col-lg-4 mb-2">
            <div class="form-check">
              <input 
                type="checkbox" 
                name="{{ widget.name }}" 
                value="{{ choice.value }}" 
                id="{{ choice.id }}"
                {% if choice.selected %}checked{% endif %}
                class="form-check-input"
              >
              <label class="form-check-label" for="{{ choice.id }}">
                {{ choice.label }}
              </label>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>
{% endwith %}

<style>
.permissions-checkboxes .permission-group h6 {
  font-weight: 600;
  color: #495057;
}
.permissions-checkboxes .form-check-label {
  cursor: pointer;
  font-size: 0.9rem;
}
.permissions-checkboxes .form-check-input:checked {
  background-color: #0d6efd;
  border-color: #0d6efd;
}
</style>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь занятий</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/css/calendar.css' %}">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
</head>
<body>
    <div class="container">
        <h1>🧘‍♀️ Календарь занятий</h1>
        <div id="calendar"></div>
    </div>

    <!-- Модальное окно для создания/редактирования занятия -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Новое занятие</h2>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                
                <div class="form-group">
                    <label for="eventClassType">Тип занятия *</label>
                    <select id="eventClassType" required>
                        <option value="">Выберите тип занятия</option>
                        {% for class_type in class_types %}
                        <option value="{{ class_type.id }}" data-duration="{{ class_type.duration_minutes }}">{{ class_type.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="eventStart">Время начала *</label>
                    <div style="position: relative;">
                        <input type="text" id="eventStart" required style="height: 40px; font-size: 16px; cursor: pointer;" readonly placeholder="Нажмите для выбора времени">
                        <small style="color: #666; display: block; margin-top: 5px;">Дата: <span id="selectedDate"></span></small>
                    </div>
                </div>
                
                <!-- Кастомное модальное окно выбора времени -->
                <div id="timePickerModal" class="modal" style="z-index: 1001;">
                    <div class="modal-content" style="max-width: 350px; margin: 15% auto;">
                        <span class="close" id="closeTimePicker">&times;</span>
                        <h3>Выберите время</h3>
                        <div style="display: flex; gap: 20px; margin-top: 20px;">
                            <div style="flex: 1;">
                                <label>Часы</label>
                                <div id="hoursColumn" style="display: flex; flex-direction: column; gap: 5px; max-height: 200px; overflow-y: auto;"></div>
                            </div>
                            <div style="flex: 1;">
                                <label>Минуты</label>
                                <div id="minutesColumn" style="display: flex; flex-direction: column; gap: 5px; max-height: 200px; overflow-y: auto;"></div>
                            </div>
                        </div>
                        <div class="button-group" style="margin-top: 20px;">
                            <button type="button" id="confirmTimeBtn" class="btn btn-primary">OK</button>
                            <button type="button" id="cancelTimeBtn" class="btn btn-secondary">Отмена</button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="eventDuration">Длительность (минут)</label>
                    <input type="number" id="eventDuration" value="60" min="15" step="15">
                </div>
                
                <div class="form-group">
                    <label for="eventHall">Зал</label>
                    <select id="eventHall">
                        <option value="">Не выбран</option>
                        {% for hall in halls %}
                        <option value="{{ hall.id }}">{{ hall.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="eventMaxParticipants">Макс. участников</label>
                    <input type="number" id="eventMaxParticipants" value="20" min="1">
                </div>
                
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="eventRecurring" style="width: auto;">
                        <span>Повторять каждую неделю (на 4 недели)</span>
                    </label>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" id="deleteBtn" class="btn btn-danger" style="display: none;">Удалить</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно подтверждения удаления для повторяющихся событий -->
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeDeleteModal">&times;</span>
            <h2>Подтверждение удаления</h2>
            <p style="margin-bottom: 20px; color: #666;">Это повторяющееся занятие. Выберите, что удалить:</p>
            
            <div class="delete-option" onclick="document.getElementById('deleteSingle').checked = true;">
                <input type="radio" id="deleteSingle" name="deleteOption" value="single" style="width: auto;">
                <div>
                    <label for="deleteSingle">Удалить только это занятие</label>
                    <div class="description">Будет удалено только выбранное занятие из серии</div>
                </div>
            </div>
            
            <div class="delete-option" onclick="document.getElementById('deleteSeries').checked = true;">
                <input type="radio" id="deleteSeries" name="deleteOption" value="series" style="width: auto;">
                <div>
                    <label for="deleteSeries">Удалить это и последующие занятия</label>
                    <div class="description">Будет удалено это занятие и все следующие в серии</div>
                </div>
            </div>
            
            <div class="button-group" style="margin-top: 25px;">
                <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Удалить</button>
                <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Отмена</button>
            </div>
        </div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src="{% static 'core/js/calendar.js' %}"></script>
</body>
</html>
